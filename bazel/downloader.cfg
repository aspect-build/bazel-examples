# Bazel downloader config, wired up via `--downloader_config` in .bazelrc.
# See https://bazel.build/reference/command-line-reference#flag--downloader_config

# ape before 1.1.0 (here via bazel_env.bzl -> rules_coreutils) fetches its
# cosmos binaries from cosmo.zip alone, a single origin that goes down. The ape
# maintainers publish the same files to gitlab.arm.com, which ape 1.1.0 tries
# first, so the sha256 holds. Redundant once ape >= 1.1.0 resolves here.
rewrite cosmo\.zip/pub/cosmos/v/([^/]+)/bin/(.+) gitlab.arm.com/api/v4/projects/10212/packages/generic/cosmos.zip/$1/$2
rewrite cosmo\.zip/pub/cosmos/v/([^/]+)/bin/(.+) cosmo.zip/pub/cosmos/v/$1/bin/$2

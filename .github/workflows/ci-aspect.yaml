name: CI - Aspect Cloud

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    id-token: write

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

env:
    REMOTE_FLAG: ${{ secrets.ASPECT_CLOUD_API_TOKEN != '' && '--remote' || '' }}

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                fetch-depth: 0 # tags required for workspace status command
            - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
              with:
                aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
            - name: Test
              run: aspect test $REMOTE_FLAG //...

    gazelle:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
              with:
                aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
            - name: Gazelle
              run: aspect gazelle $REMOTE_FLAG

    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
              with:
                aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
            - name: Format
              run: aspect format $REMOTE_FLAG

    buildifier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
              with:
                aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
            - name: Buildifier
              run: aspect buildifier $REMOTE_FLAG

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
              with:
                aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
            - name: Lint
              run: aspect lint $REMOTE_FLAG //...
